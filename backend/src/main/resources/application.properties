# ===================================================================
# Spring Boot Application Configuration - Smart Expense Tracker
# ===================================================================

# 1. Server Configuration
server.port=8080

# 2. MySQL Database Connection Settings
# Replace 'localhost:3306/expense_tracker' with your host and DB name if different.
# Use your local MySQL username and password below.
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate / JPA Configuration
# 'update': Hibernate automatically creates or updates the database tables based on Entity classes.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console log (great for learning and debugging SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
